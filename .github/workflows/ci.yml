name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to a PR cancels the run still in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and offline tests
    runs-on: ubuntu-latest

    # Everything here runs WITHOUT credentials, on purpose.
    #
    # A fork's pull request cannot read repository secrets, so a workflow that
    # needs them fails for every outside contributor — which trains people to
    # ignore a red tick. These placeholders are enough to compile and build,
    # because nothing is fetched at build time; every page that touches data is
    # server-rendered on demand.
    #
    # The suites below are the ones that genuinely need no database, no API key
    # and no network. The rest (test:all) need a running server and real
    # services, and are documented in CONTRIBUTING.md for local runs.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: ShopiQ

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Non-blocking, and honestly labelled. There is a backlog of
        # pre-existing `no-explicit-any` errors in older modules; failing the
        # build on them would block every unrelated contribution. New code is
        # expected not to add more — see CONTRIBUTING.md.
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      # --- suites that need neither a database nor an API key ---------------

      - name: Catalogue engine
        run: npm run test:catalog

      - name: AI unit
        run: npm run test:ai-unit

      - name: AI provider
        run: npm run test:ai-provider

      - name: Cart unit
        run: npm run test:cart-unit

      - name: Payment unit
        run: npm run test:payment-unit

      - name: Voice unit
        run: npm run test:voice-unit

  secrets-scan:
    name: No committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a key committed once and deleted later is still
          # public, so scanning only the tip would miss the case that matters.
          fetch-depth: 0

      - name: Scan tracked files and history for credential shapes
        run: |
          set -euo pipefail

          # eyJ… catches a Supabase key, which is a JWT and the likeliest thing
          # to leak here. The anon key is safe to publish, but the service role
          # key is the keys to the database and they are indistinguishable by
          # shape — so both are refused, and the anon key belongs in an env var
          # regardless.
          PATTERN='eyJ[A-Za-z0-9_-]{30,}|sk-ant-[A-Za-z0-9_-]{15,}|sk_live_[A-Za-z0-9]{10,}|rzp_live_[A-Za-z0-9]{8,}|-----BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{25,}|xox[baprs]-[A-Za-z0-9-]{10,}'

          echo "== tracked files =="
          # package-lock integrity hashes are base64 and trip naive JWT rules,
          # so the lockfile is excluded rather than the rule weakened.
          if git grep -nEI "$PATTERN" -- . ':!package-lock.json'; then
            echo "::error::A credential-shaped string is committed. Rotate it, then remove it."
            exit 1
          fi

          echo "== an env file must never be tracked =="
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$'; then
            echo "::error::An environment file is tracked. Only .env.example belongs in git."
            exit 1
          fi

          echo "No credentials found."
